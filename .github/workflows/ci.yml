name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SEMANTIC_CHECK: "off"  # the advisory semantic checker never runs in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy, lenient)
        run: mypy
      - name: Known vulnerabilities in pinned dependencies (pip-audit)
        run: pip-audit -r requirements.txt
      # Gemini is stubbed in tests; no API key is needed or available here.
      - name: Tests with coverage
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml
      - run: python evaluation/validate_evaluator.py
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Component tests with coverage (Vitest)
        run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
