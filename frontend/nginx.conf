server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 21m;  # the API accepts PDFs up to 20 MB

    # API and health checks go to the backend. Buffering off so job progress (SSE) streams.
    location ~ ^/(api/|healthz$|readyz$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 610s;
    }

    # Single-page app: client-side routes (/documents/..., /versions/...) load index.html.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
