# Command-line use: `alembic upgrade head`, `alembic revision -m "..."`.
# The database URL is not set here; migrations/env.py takes it from app.db (DATABASE_URL or data/safesop.db).
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
